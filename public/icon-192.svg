<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4a1d96"/>
      <stop offset="100%" stop-color="#2d1066"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shine)"/>
  <!-- Small stars -->
  <circle cx="90" cy="100" r="6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="410" cy="80" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="70" cy="320" r="5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="430" cy="370" r="7" fill="rgba(255,255,255,0.45)"/>
  <circle cx="380" cy="130" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="120" cy="420" r="4" fill="rgba(255,255,255,0.4)"/>
  <!-- Chess piece emoji -->
  <text x="256" y="310" font-size="280" text-anchor="middle" dominant-baseline="central" fill="white">♞</text>
</svg>